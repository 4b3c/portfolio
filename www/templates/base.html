<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "Flask + Tailwind" }}</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='dist/tailwind.css') }}">
  <!-- phones and tablets: bigger text. Sizes are in rem, so raising the root
       scales everything; the small sizes go up a step more, to be readable. -->
  <style>
    @media (max-width: 640px), (pointer: coarse) {
      html { font-size: 17px; }
      html .text-xs { font-size: 0.8125rem; line-height: 1.2rem; }
      html .text-sm { font-size: 0.9375rem; line-height: 1.4rem; }
    }
  </style>

</head>
<body class="bg-slate-900 text-slate-100">
  <canvas id="grid-bg" class="fixed inset-0 -z-10" data-bg="{% block grid_bg %}#000000{% endblock %}"></canvas>
  <script src="{{ url_for('static', filename='src/grid-bg.js') }}" defer></script>

  <main class="max-w-4xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
